<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cedars Lakeside · Optional Dress Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3ea;
    --paper-deep: #efe8d8;
    --ink: #22301f;
    --muted: #7c826f;
    --card: #fffdf7;
    --line: #e6ddc9;
    --gold: #b3862f;
    --green: #2f4a36;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(47, 74, 54, 0.10);
    --shadow-soft: 0 4px 14px rgba(47, 74, 54, 0.06);
    /* Seasonal stained-glass tints — two soft panes of light behind the page */
    --tint-a: rgba(179, 134, 47, 0.10);
    --tint-b: rgba(47, 74, 54, 0.06);
  }
  body[data-season="winter"] { --tint-a: rgba(94, 132, 190, 0.20); --tint-b: rgba(142, 99, 196, 0.12); }
  body[data-season="spring"] { --tint-a: rgba(110, 176, 120, 0.19); --tint-b: rgba(227, 178, 60, 0.12); }
  body[data-season="summer"] { --tint-a: rgba(227, 178, 60, 0.19); --tint-b: rgba(58, 111, 168, 0.12); }
  body[data-season="autumn"] { --tint-a: rgba(196, 96, 58, 0.18); --tint-b: rgba(122, 82, 48, 0.12); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 420px at 15% -120px, var(--tint-a), transparent 65%),
      radial-gradient(800px 460px at 90% 10%, var(--tint-b), transparent 65%),
      var(--paper);
    color: var(--ink);
    line-height: 1.45;
    padding: 0 0 24px;
    -webkit-font-smoothing: antialiased;
    transition: background 0.6s ease;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  .serif { font-family: "Playfair Display", Georgia, "Times New Roman", serif; }

  /* ------------------------------------------------ Header (compact) */
  header {
    max-width: 1040px; margin: 0 auto;
    padding: 16px 20px 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  header .brand {
    font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold);
  }
  header h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 24px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.05;
    margin-top: 2px; color: var(--green);
  }
  header .sub { font-size: 11.5px; color: var(--muted); font-style: italic; margin-top: 1px; }
  .today-btn {
    font-size: 12px; font-weight: 600; color: var(--green); letter-spacing: 0.3px;
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 16px; cursor: pointer; box-shadow: var(--shadow-soft);
    transition: all 0.15s ease; flex-shrink: 0;
  }
  .today-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ------------------------------------------------ Two-column layout */
  .main { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  @media (min-width: 860px) {
    .main { grid-template-columns: 1.08fr 1fr; align-items: start; }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
    padding: 16px;
  }
  .panel h2 {
    font-size: 10px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 12px;
  }

  /* ------------------------------------------------ Hero swatch */
  .swatch {
    position: relative;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    min-height: 190px;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px;
    overflow: hidden;
    cursor: default;
  }
  .swatch::after {
    content:""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% -10%, rgba(255,255,255,0.22), transparent 55%);
    pointer-events: none;
  }
  /* Stained glass: irregular panes of light and shadow, joined by dark leading.
     Built from overlapping conic wedges + two crossing lead-line grids. */
  .swatch .glass {
    position: absolute; inset: 0; pointer-events: none;
    background:
      conic-gradient(from 200deg at 18% 30%,  rgba(255,255,255,0.20) 0 70deg, transparent 70deg 360deg),
      conic-gradient(from 20deg  at 78% 22%,  rgba(0,0,0,0.13) 0 80deg, transparent 80deg 360deg),
      conic-gradient(from 300deg at 62% 72%,  rgba(255,255,255,0.14) 0 90deg, transparent 90deg 360deg),
      conic-gradient(from 110deg at 30% 82%,  rgba(0,0,0,0.10) 0 65deg, transparent 65deg 360deg),
      conic-gradient(from 250deg at 90% 60%,  rgba(255,255,255,0.10) 0 60deg, transparent 60deg 360deg),
      repeating-linear-gradient(112deg, transparent 0 22%, rgba(18,14,8,0.30) 22% 22.7%),
      repeating-linear-gradient(24deg,  transparent 0 31%, rgba(18,14,8,0.24) 31% 31.8%);
    mix-blend-mode: soft-light;
    opacity: 0.95;
  }
  .swatch > *:not(.glass) { position: relative; z-index: 1; }
  .swatch .team {
    font-family: "Playfair Display", Georgia, serif; font-style: italic;
    font-size: 15px; font-weight: 500; opacity: 0.86; margin: -2px 0 6px; letter-spacing: 0.2px;
  }
  .swatch .team:empty { display: none; }

  /* Theme-week banner — a leaded strip under the hero */
  .theme-banner { display: none; }
  .theme-banner.on, .theme-banner.soon {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px; border-radius: 12px; font-size: 12.5px;
    border: 1px solid var(--line);
    background: linear-gradient(90deg, var(--tint-a), var(--tint-b)), var(--card);
  }
  .theme-banner.soon { opacity: 0.8; font-size: 12px; }
  .theme-banner .t-emoji { font-size: 16px; }
  .theme-banner b { font-family: "Playfair Display", Georgia, serif; font-weight: 600; color: var(--green); }
  .theme-banner .t-note { color: var(--muted); font-style: italic; }
  .swatch .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }
  .swatch .name { font-family: "Playfair Display", Georgia, serif; font-size: 44px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; margin: 7px 0 4px; }
  .swatch .hex { font-size: 12px; font-weight: 600; opacity: 0.75; font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .swatch .tagline { font-size: 12px; margin-top: 9px; opacity: 0.82; font-weight: 500; }
  .swatch .tomorrow {
    position: absolute; top: 16px; right: 18px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.4px;
    background: rgba(0,0,0,0.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 5px 10px; border-radius: 999px; opacity: 0.92;
    border: 1px solid rgba(255,255,255,0.22);
  }
  .swatch .tomorrow::before { content: "Next · "; opacity: 0.7; font-weight: 500; }

  .qualifies {
    background: var(--paper);
    border: 1px solid var(--line); border-left: 3px solid var(--gold);
    border-radius: 12px; padding: 12px 15px; font-size: 13px;
  }
  .qualifies b { font-weight: 700; }

  /* ------------------------------------------------ Week strip */
  .week { display: flex; gap: 6px; }
  .day {
    flex: 1; text-align: center; cursor: pointer;
    background: var(--card); border-radius: 11px; padding: 8px 2px;
    box-shadow: var(--shadow-soft); border: 1px solid var(--line);
    transition: transform 0.1s ease, border-color 0.1s ease; min-width: 0;
  }
  .day:hover { transform: translateY(-2px); }
  .day.selected { border-color: var(--gold); box-shadow: 0 6px 18px rgba(179,134,47,0.18); }
  .day .dow { font-size: 9.5px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--muted); }
  .day .sw { width: 100%; height: 26px; border-radius: 7px; margin: 5px 0 4px; box-shadow: inset 0 0 0 1.5px rgba(34,48,31,0.18); }
  .day .cname { font-size: 9.5px; font-weight: 600; line-height: 1.1; }
  .day.free .sw { background: repeating-linear-gradient(45deg, #ece5d4, #ece5d4 4px, #e4dcc8 4px, #e4dcc8 8px); }

  /* ------------------------------------------------ Why chips (2x2) */
  .why { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .why-chip {
    background: linear-gradient(160deg, var(--tint-a), transparent 70%), var(--paper);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 2px; min-width: 0;
  }
  .why-chip .icon { font-size: 17px; line-height: 1; }
  .why-chip .label { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 5px; }
  .why-chip .value { font-family: "Playfair Display", Georgia, serif; font-size: 14px; font-weight: 600; line-height: 1.15; color: var(--ink); }
  .why-chip .voice { font-size: 10.5px; color: var(--muted); line-height: 1.35; margin-top: 4px; font-style: italic; }

  /* ------------------------------------------------ Month grid */
  .month-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .month-bar h2 { margin-bottom: 0; }
  .month-nav { display: flex; gap: 5px; }
  .nav-btn {
    width: 30px; height: 30px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--card);
    color: var(--green); font-size: 17px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-soft); transition: all 0.12s ease;
  }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); }
  .nav-btn:active { transform: scale(0.94); }
  .month-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 3px; }
  .month-head span { text-align: center; font-size: 9px; font-weight: 700; color: var(--muted); letter-spacing: 0.3px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .mcell {
    min-height: 40px; border-radius: 8px; background: var(--card);
    border: 1px solid var(--line); padding: 3px; cursor: pointer;
    display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    transition: transform 0.06s ease;
  }
  .mcell:hover { transform: scale(1.07); z-index: 1; }
  .mcell .num { font-size: 10px; font-weight: 700; line-height: 1; }
  .mcell .bar { width: 100%; height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(34,48,31,0.18); }
  .mcell .cn { font-size: 7px; font-weight: 600; color: var(--muted); line-height: 1; text-align: center; }
  .mcell.blank { background: transparent; border: none; cursor: default; }
  .mcell.free { background: var(--paper); border-style: dashed; }
  .mcell.free .bar { background: transparent !important; }
  .mcell.selected { outline: 2px solid var(--gold); outline-offset: -1px; }
  .mcell.today { box-shadow: 0 0 0 2px var(--green) inset; }
  .mcell.themed { background: linear-gradient(135deg, var(--tint-a), var(--tint-b)), var(--card); }

  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 18px; padding: 0 20px; }
  footer .brand { font-family: "Playfair Display", Georgia, serif; font-size: 13px; font-weight: 600; color: var(--green); margin-bottom: 1px; }
  footer .fine { font-size: 10.5px; letter-spacing: 1px; }
  footer .ornament { color: var(--gold); font-size: 12px; margin-bottom: 4px; letter-spacing: 6px; }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Cedars Lakeside</div>
    <h1>Optional Dress Code</h1>
    <div class="sub">today's color, chosen by the sky</div>
  </div>
  <button class="today-btn" id="todayBtn">Today</button>
</header>

<div class="wrap">
  <div class="main">

    <div class="col">
      <div class="swatch" id="swatch">
        <div class="glass"></div>
        <div class="eyebrow" id="swEyebrow"></div>
        <div class="name" id="swName"></div>
        <div class="team" id="swTeam"></div>
        <div class="hex" id="swHex"></div>
        <div class="tagline" id="swTag"></div>
        <div class="tomorrow" id="swTomorrow"></div>
      </div>
      <div class="theme-banner" id="themeBanner"></div>
      <div class="qualifies" id="qualifies"></div>
      <div class="panel">
        <h2>This week</h2>
        <div class="week" id="week"></div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <h2>Why this color</h2>
        <div class="why" id="why"></div>
      </div>
      <div class="panel">
        <div class="month-bar">
          <h2 id="monthTitle">This month</h2>
          <div class="month-nav">
            <button id="prevMonth" class="nav-btn" aria-label="Previous month">‹</button>
            <button id="nextMonth" class="nav-btn" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="month-head" id="monthHead"></div>
        <div class="month-grid" id="monthGrid"></div>
      </div>
    </div>

  </div>

  <footer>
    <div class="ornament">✦ ✦ ✦</div>
    <div class="brand">Cedars Lakeside</div>
    <div class="fine">Optional Dress Code · ☾ ☉ ♀ ♂ ♃ ☿ ♄</div>
  </footer>
</div>

<script>
// ---------------------------------------------------------------
//  Palette — basic colors, picked from the sky each day (wear any shade you own)
//  `weight` = how often it comes up, tuned to what the closets actually hold.
//  Deep stock (brown/red/black/white/blue/grey) = 3, thin (green) = 2, rare (purple) = 1.
//  `season` (optional) = months the color is active; omitted = year-round.
//  `team` = the day's team name, for saying out loud.
// ---------------------------------------------------------------
const PALETTE = [
  { label: "Purple", hex: "#8E63C4", weight: 1, team: "The Royal Court",  qualifies: "lilac, lavender, plum, orchid, mauve, violet" },
  { label: "Red",    hex: "#C4453A", weight: 3, team: "The Ember Crew",   qualifies: "maroon, burgundy, brick, coral, rust, wine" },
  { label: "Blue",   hex: "#3A6FA8", weight: 3, team: "The Lakeside Tide", qualifies: "navy, sky, steel, denim, powder, teal" },
  { label: "Green",  hex: "#4E8A5A", weight: 2, team: "The Cedar Guard",  qualifies: "olive, forest, sage, emerald, moss, pine" },
  { label: "Brown",  hex: "#7A5230", weight: 3, team: "The Groundskeepers", qualifies: "tan, camel, khaki, chocolate, taupe, chestnut" },
  { label: "Grey",   hex: "#8A8D8F", weight: 3, team: "The Slate Society", qualifies: "charcoal, slate, silver, heather, stone, dove" },
  { label: "White",  hex: "#F1EFEA", weight: 3, team: "The Frost Line",   qualifies: "cream, ivory, ecru, off-white, light grey, heather" },
  { label: "Black",  hex: "#2E2E2E", weight: 3, team: "The Night Shift",  qualifies: "charcoal, graphite, slate, dark grey, onyx" },
  //  Yellow: spring & summer only (Mar–Aug). Thin weight — the closets are still catching up. ☀️
  { label: "Yellow", hex: "#E3B23C", weight: 2, team: "The Sunrise Club", season: [3,4,5,6,7,8], qualifies: "mustard, gold, butter, lemon, marigold, honey" },
];
const byLabel = l => PALETTE.find(c => c.label === l);

// ---------------------------------------------------------------
//  Themed weeks — a handful a year. That week the sky picks only from the
//  theme's colors. Each is anchored to a date ([month, day]); whichever
//  Mon–Fri week contains that date is the theme week, so it works every year.
// ---------------------------------------------------------------
const THEME_WEEKS = [
  { name:"Jewel Tone Week",   emoji:"💎", anchor:[1,21],  colors:["Purple","Green","Blue","Red"],  note:"Deep and saturated — emerald, sapphire, ruby, amethyst" },
  { name:"Neutrals Week",     emoji:"🪨", anchor:[3,11],  colors:["Grey","Brown","White","Black"], note:"Calm and quiet — let texture do the talking" },
  { name:"Fresh Start Week",  emoji:"🌱", anchor:[5,6],   colors:["Green","Yellow","White","Blue"], note:"Spring on your sleeve — light, bright, awake" },
  { name:"Summer Sky Week",   emoji:"🌤️", anchor:[7,15],  colors:["Blue","White","Yellow"],       note:"Sky, cloud, sun — nothing heavier" },
  { name:"Earth Tone Week",   emoji:"🍁", anchor:[9,23],  colors:["Brown","Green","Red","Grey"],   note:"Harvest colors — warm, grounded, layered" },
  { name:"Monochrome Week",   emoji:"◐",  anchor:[11,11], colors:["Black","Grey","White"],        note:"One color head to toe — any shade, all the way down" },
];
//  Monday of the week containing d (Mon–Fri weeks; weekends belong to the week before)
function mondayOf(d) {
  const m = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  m.setDate(m.getDate() - ((m.getDay() + 6) % 7));
  return m;
}
function themeWeekFor(d) {
  const mon = mondayOf(d).getTime();
  return THEME_WEEKS.find(t => mondayOf(new Date(d.getFullYear(), t.anchor[0] - 1, t.anchor[1])).getTime() === mon) || null;
}

// ---------------------------------------------------------------
//  Seasons — drive the stained-glass tint of the whole page
// ---------------------------------------------------------------
function seasonOf(d) {
  const m = d.getMonth() + 1;
  return m <= 2 || m === 12 ? "winter" : m <= 5 ? "spring" : m <= 8 ? "summer" : "autumn";
}
//  Colors in play for a given date, expanded by weight. A theme week narrows the
//  field to its colors (equal weight); otherwise seasonal colors only in their months.
function weightedFor(d) {
  const theme = themeWeekFor(d);
  if (theme) return theme.colors.map(byLabel);
  const m = d.getMonth() + 1;
  return PALETTE.filter(c => !c.season || c.season.includes(m)).flatMap(c => Array(c.weight).fill(c));
}

//  Pink is a rare treat, not part of the rotation — see isPinkDay()
const PINK = { label: "Pink", hex: "#E88AA0", team: "The Rose Garden", qualifies: "blush, rose, magenta, raspberry, petal, mauve" };

//  Flannel — any flannel, any color, all cold season (Oct 1 – Mar 31). 🍂
//  Not tied to a weekday: the sky rolls it, ~1 in 4 workdays, landing anywhere in the week.
const FLANNEL = { label: "Flannel", hex: "#8B3A2E", team: "The Lumber Yard", qualifies: "any flannel — red, brown, black, white, plaid, whatever you've got" };
const FLANNEL_MONTHS = [10, 11, 12, 1, 2, 3];
const FLANNEL_ODDS = 4; // 1 in N
function isFlannelDay(d, sign, moon) {
  if (!FLANNEL_MONTHS.includes(d.getMonth() + 1)) return false;
  const x = SIGNS.indexOf(sign) * 100000 + d.getDay() * 10000 + Math.round(moon.frac * 1000);
  return hash32(x ^ 0x5EED) % FLANNEL_ODDS === 0; // separate salt so it's independent of the color roll
}

//  Orange lives only here — the one week a year it's allowed 🎃
const ORANGE = { label: "Orange", hex: "#E0822E", team: "The Pumpkin Patch", qualifies: "burnt orange, rust, pumpkin, amber, copper, peach" };

// ---------------------------------------------------------------
//  Holiday overrides — these dates just win, no matter what the sky says
//  Fixed dates: [month, day]. Ranges: { from:[m,d], to:[m,d] }.
//  Floating (e.g. Thanksgiving) computed in holidayFor().
// ---------------------------------------------------------------
const HOLIDAYS = [
  { name:"Valentine's Day",  emoji:"🌹", color:PINK,                                  when:[2,14],  note:"Pink or red, your call" },
  { name:"St. Patrick's Day",emoji:"☘️", color:PALETTE[3],                            when:[3,17],  note:"Green or get pinched" },
  { name:"Independence Day", emoji:"🎆", color:PALETTE[1],                            when:[7,4],   note:"Red, white & blue — any of the three" },
  { name:"Halloween Week",   emoji:"🎃", color:ORANGE,                                range:{from:[10,26], to:[10,31]}, note:"The one week orange is allowed" },
  { name:"Christmas Week",   emoji:"🎄", color:PALETTE[1],                            range:{from:[12,21], to:[12,24]}, note:"Red one day, green the next" },
  { name:"New Year's Eve",   emoji:"🥂", color:PALETTE[7],                            when:[12,31], note:"Black tie, or close enough" },
];

//  Alternate red/green within Christmas week for variety
function christmasColor(d) { return (d.getDate() % 2 === 0) ? PALETTE[3] : PALETTE[1]; }

function holidayFor(d) {
  const m = d.getMonth() + 1, day = d.getDate();
  for (const h of HOLIDAYS) {
    if (h.when && h.when[0] === m && h.when[1] === day) {
      return h;
    }
    if (h.range) {
      const [fm, fd] = h.range.from, [tm, td] = h.range.to;
      const after = (m > fm) || (m === fm && day >= fd);
      const before = (m < tm) || (m === tm && day <= td);
      if (after && before) {
        if (h.name === "Christmas Week") return { ...h, color: christmasColor(d) };
        return h;
      }
    }
  }
  // Thanksgiving: 4th Thursday of November -> brown
  if (m === 11 && d.getDay() === 4) {
    const nth = Math.ceil(day / 7);
    if (nth === 4) return { name:"Thanksgiving", emoji:"🦃", color:PALETTE[4], note:"Earthy browns for the feast" };
  }
  return null;
}

// ---------------------------------------------------------------
//  Astro one-liners — give the "why" panel a voice
// ---------------------------------------------------------------
const PLANET_VOICE = {
  Moon:    "The Moon rules Mondays — quiet, reflective, a little dreamy.",
  Mars:    "Mars rules Tuesdays — the warrior planet. Bring some fire.",
  Mercury: "Mercury rules Wednesdays — the trickster planet, quick and clever.",
  Jupiter: "Jupiter rules Thursdays — the king. Wear it like you own the place.",
  Venus:   "Venus rules Fridays — love, beauty, and a well-earned weekend.",
};
const MOON_VOICE = {
  "New Moon":        "New moon: fresh starts, quiet confidence.",
  "Waxing Crescent": "Waxing crescent: things are building. So are you.",
  "First Quarter":   "First quarter: halfway lit, fully committed.",
  "Waxing Gibbous":  "Waxing gibbous: almost there — lean in.",
  "Full Moon":       "Full moon: everything's brighter tonight, including you.",
  "Waning Gibbous":  "Waning gibbous: gratitude phase. Wear it easy.",
  "Last Quarter":    "Last quarter: let go of what's not working.",
  "Waning Crescent": "Waning crescent: rest up, the cycle turns again soon.",
};
const SIGN_VOICE = {
  Capricorn:"Capricorn season — disciplined, grounded, quietly ambitious.",
  Aquarius: "Aquarius season — a little unconventional, in the best way.",
  Pisces:   "Pisces season — dreamy and intuitive.",
  Aries:    "Aries season — bold, first out the gate.",
  Taurus:   "Taurus season — comfort, quality, no rush.",
  Gemini:   "Gemini season — curious and chatty.",
  Cancer:   "Cancer season — home, heart, and a soft edge.",
  Leo:      "Leo season — main-character energy.",
  Virgo:    "Virgo season — precise, polished, understated.",
  Libra:    "Libra season — balance, beauty, good taste.",
  Scorpio:  "Scorpio season — deep, intense, magnetic.",
  Sagittarius:"Sagittarius season — adventurous and optimistic.",
};

//  Pink Day — rare, sky-rolled, any weekday. ~1 in 20 workdays ≈ once a month.
//  Own salt so it's independent of the color and flannel rolls.
const PINK_ODDS = 20;
function isPinkDay(d, sign, moon) {
  const x = SIGNS.indexOf(sign) * 100000 + d.getDay() * 10000 + Math.round(moon.frac * 1000);
  return hash32(x ^ 0x9D1E) % PINK_ODDS === 0;
}

// ---------------------------------------------------------------
//  The celestial hash — sun × moon × day pick the color
//  Combines three real astronomical quantities (the sun's zodiac position,
//  the moon's continuous phase, and the day's ruling planet) and hashes them
//  into a palette index. Deterministic (both phones agree) but scatters
//  like random — no more "shift by one color each week".
// ---------------------------------------------------------------
function hash32(x) {
  x ^= x >>> 16;
  x = Math.imul(x, 0x7feb352d);
  x ^= x >>> 15;
  x = Math.imul(x, 0x846ca68b);
  x ^= x >>> 16;
  return x >>> 0;
}

//  Pick a color for the date from the sky. Returns a PALETTE entry.
function celestialColor(d, sign, moon) {
  const signIdx = SIGNS.indexOf(sign);            // 0..11  (sun's annual position)
  const moonSteps = Math.round(moon.frac * 1000); // 0..1000 (moon's continuous position)
  const x = signIdx * 100000 + d.getDay() * 10000 + moonSteps;
  const table = weightedFor(d);
  return table[hash32(x) % table.length];
}

// ---------------------------------------------------------------
//  Planetary day-of-week (the fun "why")
// ---------------------------------------------------------------
const DAYS = {
  0: { name: "Sunday",    planet: "Sun",     sym: "☉", free: true },
  1: { name: "Monday",    planet: "Moon",    sym: "☾", free: false },
  2: { name: "Tuesday",   planet: "Mars",    sym: "♂", free: false },
  3: { name: "Wednesday", planet: "Mercury", sym: "☿", free: false },
  4: { name: "Thursday",  planet: "Jupiter", sym: "♃", free: false },
  5: { name: "Friday",    planet: "Venus",   sym: "♀", free: false },
  6: { name: "Saturday",  planet: "Saturn",  sym: "♄", free: true },
};

// ---------------------------------------------------------------
//  Zodiac signs -> elements (fun context only)
// ---------------------------------------------------------------
const SIGNS = [
  { name:"Capricorn",   sym:"♑", el:"earth", s:[12,22], e:[1,19]  },
  { name:"Aquarius",    sym:"♒", el:"air",   s:[1,20],  e:[2,18]  },
  { name:"Pisces",      sym:"♓", el:"water", s:[2,19],  e:[3,20]  },
  { name:"Aries",       sym:"♈", el:"fire",  s:[3,21],  e:[4,19]  },
  { name:"Taurus",      sym:"♉", el:"earth", s:[4,20],  e:[5,20]  },
  { name:"Gemini",      sym:"♊", el:"air",   s:[5,21],  e:[6,20]  },
  { name:"Cancer",      sym:"♋", el:"water", s:[6,21],  e:[7,22]  },
  { name:"Leo",         sym:"♌", el:"fire",  s:[7,23],  e:[8,22]  },
  { name:"Virgo",       sym:"♍", el:"earth", s:[8,23],  e:[9,22]  },
  { name:"Libra",       sym:"♎", el:"air",   s:[9,23],  e:[10,22] },
  { name:"Scorpio",     sym:"♏", el:"water", s:[10,23], e:[11,21] },
  { name:"Sagittarius", sym:"♐", el:"fire",  s:[11,22], e:[12,21] },
];
const ELEMENTS = {
  fire:  { name:"Fire",  vibe:"hot & bright" },
  earth: { name:"Earth", vibe:"rich & earthy" },
  air:   { name:"Air",   vibe:"light & airy" },
  water: { name:"Water", vibe:"deep & cool" },
};

// ---------------------------------------------------------------
//  Astronomy helpers
// ---------------------------------------------------------------
function getSign(date) {
  const m = date.getMonth() + 1, d = date.getDate();
  for (const sg of SIGNS) {
    if ((m === sg.s[0] && d >= sg.s[1]) || (m === sg.e[0] && d <= sg.e[1])) return sg;
  }
  return SIGNS[0];
}

function getMoon(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate()); // midnight — time-independent
  const synodic = 29.53058867;
  const knownNew = Date.UTC(2000, 0, 6, 18, 14, 0);
  const days = (d.getTime() - knownNew) / 86400000;
  const phase = ((days % synodic) + synodic) % synodic;
  const frac = phase / synodic;                    // 0 new .. 0.5 full .. 1 new
  const illum = (1 - Math.cos(2 * Math.PI * frac)) / 2;   // 0..1
  const idx = Math.round(frac * 8) % 8;
  const NAMES  = ["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"];
  const EMOJIS = ["🌑","🌒","🌓","🌔","🌕","🌖","🌗","🌘"];
  return { frac, illum, name: NAMES[idx], emoji: EMOJIS[idx] };
}

// ---------------------------------------------------------------
//  Core: resolve a date to a color
// ---------------------------------------------------------------
function colorForDate(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate()); // midnight — color depends on date only
  const dow = d.getDay();
  const day = DAYS[dow];
  const sign = getSign(d);
  const moon = getMoon(d);
  const theme = themeWeekFor(d);
  const base = { weekend:false, day, sign, moon, theme, isPink:false, isFlannel:false, holiday:null };
  const pick = (c, extra) => ({ ...base, ...extra,
    shade:{name:c.label, hex:c.hex}, team:c.team,
    family:{label:c.label, qualifies:c.qualifies} });

  if (day.free) {
    return { ...base, weekend:true, team:null,
      shade:{name:"Free day", hex:"#d3d5da"},
      family:{label:"Weekend", qualifies:"wear whatever — recharge your palette"} };
  }

  // Holidays win over everything
  const hol = holidayFor(d);
  if (hol) return pick(hol.color, { holiday:hol });

  // Theme weeks own their run — flannel and pink sit out so the theme reads clean
  if (!theme) {
    if (isFlannelDay(d, sign, moon)) return pick(FLANNEL, { isFlannel:true });
    if (isPinkDay(d, sign, moon))    return pick(PINK,    { isPink:true });
  }

  let c = celestialColor(d, sign, moon);
  // Keep two weekdays in a row from landing on the same color (stays lively).
  // Compare against yesterday's *final* color (it may itself have been bumped), and bump
  // within the colors active for this date so a seasonal color never leaks out of season.
  // Step must not be a multiple of the palette size or it'd wrap back onto the same color.
  const prev = new Date(d); prev.setDate(prev.getDate() - 1);
  if (prev.getDay() >= 1 && prev.getDay() <= 5 && !themeWeekFor(prev) === !theme) {
    const pr = colorForDate(prev);
    if (!pr.holiday && !pr.isFlannel && !pr.isPink && pr.shade.name === c.label) {
      const active = [...new Set(weightedFor(d))];
      const step = active.length > 4 ? 3 : 1;
      c = active[(active.indexOf(c) + step) % active.length];
    }
  }
  return pick(c, {});
}

//  Next workday after a given date (skips weekends)
function nextWorkday(date) {
  const n = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  do { n.setDate(n.getDate() + 1); } while (n.getDay() === 0 || n.getDay() === 6);
  return n;
}

// ---------------------------------------------------------------
//  Rendering
// ---------------------------------------------------------------
function contrastText(hex) {
  const c = hex.replace("#","");
  const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.6 ? "#1a1a1a" : "#ffffff";
}

let selected = new Date();
let view = new Date(selected.getFullYear(), selected.getMonth(), 1);
const el = id => document.getElementById(id);
const fmt = (d) => d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });

function renderHero(date) {
  const r = colorForDate(date);
  const fg = contrastText(r.shade.hex);
  const sw = el("swatch");
  sw.style.background = r.shade.hex;
  sw.style.color = fg;
  document.body.dataset.season = seasonOf(date);
  const isToday = date.toDateString() === new Date().toDateString();
  el("swEyebrow").textContent = r.weekend ? "Weekend" : (isToday ? "Today" : fmt(date));
  el("swName").textContent = r.shade.name;
  el("swHex").textContent = r.shade.hex.toUpperCase();
  el("swTeam").textContent = r.team ? r.team : "";
  el("swTag").textContent = r.weekend
    ? "wear whatever — recharge your palette"
    : r.holiday
      ? r.holiday.emoji + " " + r.holiday.name + " — " + r.holiday.note
      : r.day.name + " · " + r.day.planet + " · " + r.sign.sym + " " + r.sign.name + " · " + r.moon.emoji + " " + r.moon.name
        + (r.isFlannel ? " — 🍂 Flannel Day!" : r.isPink ? " — Pink Day!" : "");

  // Theme-week banner — shows during the week, and the week before as a heads-up
  const banner = el("themeBanner");
  const upcoming = themeWeekFor(new Date(date.getFullYear(), date.getMonth(), date.getDate() + 7));
  if (r.theme) {
    banner.innerHTML = `<span class="t-emoji">${r.theme.emoji}</span><b>${r.theme.name}</b><span class="t-note">${r.theme.note}</span>`;
    banner.className = "theme-banner on";
  } else if (upcoming && !r.weekend) {
    banner.innerHTML = `<span class="t-emoji">${upcoming.emoji}</span><b>Next week: ${upcoming.name}</b><span class="t-note">${upcoming.colors.join(" · ")}</span>`;
    banner.className = "theme-banner soon";
  } else {
    banner.className = "theme-banner";
  }

  // Tomorrow whisper — next workday's color, for planning
  const nxt = nextWorkday(date);
  const nr = colorForDate(nxt);
  const nxtLabel = nxt.toLocaleDateString(undefined, { weekday:"long" });
  el("swTomorrow").textContent = nxtLabel + ": " + nr.shade.name + (nr.holiday ? " " + nr.holiday.emoji : nr.isFlannel ? " 🍂" : nr.theme && !r.theme ? " " + nr.theme.emoji : "");

  const q = el("qualifies");
  if (r.weekend) {
    q.innerHTML = "<b>Weekend.</b> " + r.family.qualifies;
  } else if (r.holiday) {
    q.innerHTML = r.holiday.emoji + " <b>" + r.holiday.name + "</b> — <b>" + r.family.label + "</b> today: <i>" + r.family.qualifies + "</i>. Holidays overrule the sky!";
  } else if (r.isFlannel) {
    q.innerHTML = "🍂 <b>Flannel Day</b> — <i>" + r.family.qualifies + "</i>. Cold out. Cozy up.";
  } else if (r.theme) {
    q.innerHTML = r.theme.emoji + " <b>" + r.theme.name + "</b> — <b>" + r.family.label + "</b> today: <i>" + r.family.qualifies + "</i>.";
  } else {
    q.innerHTML = "<b>" + r.family.label + "</b> today — any shade counts: <i>" + r.family.qualifies + "</i>. Do your best!";
  }

  // Why chips — with a voice
  const why = el("why");
  const blendValue = r.weekend ? "Free & easy" : r.holiday ? r.holiday.emoji + " Holiday" : r.theme ? r.theme.emoji + " Theme week" : r.isFlannel ? "🍂 Flannel Day" : r.isPink ? "Pink Day" : "sun · moon · day";
  const blendVoice = r.weekend ? "No rules on the weekend."
    : r.holiday ? r.holiday.note
    : r.theme ? "This week the sky picks from " + r.theme.colors.length + " colors only."
    : r.isFlannel ? "Any flannel counts — the color is yours. Today you're " + r.team + "."
    : r.isPink ? "A rare one — the sky rolled pink. Today you're " + r.team + "."
    : "Three sky-readings, one color. Today you're " + r.team + ".";
  const rows = [
    { icon: r.day.sym,    label:"Day",   value: r.day.name + " · " + r.day.planet, voice: PLANET_VOICE[r.day.planet] || "" },
    { icon: r.sign.sym,   label:"Sun",   value: r.sign.name + " · " + ELEMENTS[r.sign.el].name, voice: SIGN_VOICE[r.sign.name] || "" },
    { icon: r.moon.emoji, label:"Moon",  value: r.moon.name, voice: MOON_VOICE[r.moon.name] || "" },
    { icon: "✨",         label:"Blend", value: blendValue, voice: blendVoice },
  ];
  why.innerHTML = rows.map(row => `
    <div class="why-chip">
      <div class="icon">${row.icon}</div>
      <div class="label">${row.label}</div>
      <div class="value">${row.value}</div>
      <div class="voice">${row.voice}</div>
    </div>`).join("");
}

function renderWeek(date) {
  const day = date.getDay();
  const monday = new Date(date);
  monday.setDate(date.getDate() - ((day + 6) % 7));
  const week = el("week");
  week.innerHTML = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const r = colorForDate(d);
    const cell = document.createElement("div");
    cell.className = "day" + (r.weekend ? " free" : "") + (d.toDateString() === date.toDateString() ? " selected" : "");
    cell.innerHTML = `
      <div class="dow">${DAYS[d.getDay()].name.slice(0,3)}</div>
      <div class="sw" style="background:${r.shade.hex}"></div>
      <div class="cname">${r.weekend ? "free" : (r.holiday ? r.holiday.emoji + " " : "") + r.shade.name}</div>`;
    cell.onclick = () => { selected = d; renderAll(); };
    week.appendChild(cell);
  }
}

function renderMonth() {
  const y = view.getFullYear(), m = view.getMonth();
  el("monthTitle").textContent = view.toLocaleDateString(undefined, { month:"long", year:"numeric" });
  el("monthHead").innerHTML = ["S","M","T","W","T","F","S"].map(s => `<span>${s}</span>`).join("");

  const first = new Date(y, m, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const today = new Date();

  const grid = el("monthGrid");
  grid.innerHTML = "";
  for (let i = 0; i < startDow; i++) grid.appendChild(blank());

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(y, m, d);
    const r = colorForDate(dt);
    const cell = document.createElement("div");
    let cls = "mcell";
    if (r.weekend) cls += " free";
    if (dt.toDateString() === selected.toDateString()) cls += " selected";
    if (dt.toDateString() === today.toDateString()) cls += " today";
    cell.className = cls;
    cell.innerHTML = `
      <div class="num">${d}</div>
      <div class="bar" style="background:${r.shade.hex}"></div>
      <div class="cn">${r.weekend ? "free" : (r.holiday ? r.holiday.emoji : r.isFlannel ? "🍂" : r.shade.name)}</div>`;
    if (r.theme && !r.weekend) cell.classList.add("themed");
    cell.onclick = () => { selected = dt; renderAll(); };
    grid.appendChild(cell);
  }
}

function blank() {
  const b = document.createElement("div");
  b.className = "mcell blank";
  return b;
}

function renderAll() {
  document.title = colorForDate(selected).shade.name + " · Cedars Lakeside";
  renderHero(selected);
  renderWeek(selected);
  renderMonth();
}

el("todayBtn").onclick = () => { selected = new Date(); view = new Date(selected.getFullYear(), selected.getMonth(), 1); renderAll(); };
el("prevMonth").onclick = () => { view.setMonth(view.getMonth() - 1); renderAll(); };
el("nextMonth").onclick = () => { view.setMonth(view.getMonth() + 1); renderAll(); };
renderAll();
</script>
